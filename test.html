<!doctype html><html><head><meta charset="utf-8"><title>fsd tests</title></head>
<body><pre id="result">RUNNING</pre>
<script src="logic.js"></script>
<script>
let pass=0,fail=0;
function t(name,cond){ if(cond){pass++;} else {fail++; document.getElementById('result').textContent += '\nFAIL: '+name;} }
t('unlock ok', unlockOk(' fartsheetai ')===true);
t('unlock bad', unlockOk('nope')===false);
t('unlock case', unlockOk('FARTSHEETAI')===true);
t('sentences', sentenceCount('One. Two! Three? four')===3);
t('usage fresh ok', usageAllowed({},Date.now()).ok===true);
t('usage limit', usageAllowed({day:todayStr(),calls:12,lastCallTs:0},Date.now()).reason==='limit');
t('usage cooldown', usageAllowed({day:todayStr(),calls:1,lastCallTs:Date.now()-5000},Date.now()).reason==='cooldown');
t('usage day reset', usageAllowed({day:'2020-01-01',calls:12,lastCallTs:0},Date.now()).ok===true);
t('json parse plain', parseSectionJSON('{"summary":"x"}').summary==='x');
t('json parse fenced', parseSectionJSON('```json\n{"summary":"y"}\n```').summary==='y');
t('json parse garbage', parseSectionJSON('not json')===null);
t('sheet cycle 1', sectionForSheet(1)==='summary');
t('sheet cycle 5', sectionForSheet(5)==='summary');
t('sheet cycle 6', sectionForSheet(6)==='devices');
t('pages sheet1', JSON.stringify(defaultPagesForSheet(1))==='[1,10]');
t('pages sheet2', JSON.stringify(defaultPagesForSheet(2))==='[11,20]');
t('pages (2,21) per formula', JSON.stringify(defaultPagesForSheet(2,21))==='[31,40]');
t('pages (1,21) window', JSON.stringify(defaultPagesForSheet(1,21))==='[21,30]');
t('pages (5,45) per formula', JSON.stringify(defaultPagesForSheet(5,45))==='[85,94]');
t('pages start45 window', JSON.stringify(defaultPagesForSheet(1,45))==='[45,54]');
t('windows (1,1)', (function(){var w=sheetWindowsForSheet(1,1);return JSON.stringify(w)==='{"summary":[1,10],"devices":[11,20],"vocab":[21,30],"connections":[31,40]}';})());
t('windows (2,21) full', (function(){var w=sheetWindowsForSheet(2,21);return JSON.stringify(w)==='{"summary":[61,70],"devices":[71,80],"vocab":[81,90],"connections":[91,100]}';})());
t('public access', isPublicAccess('public')===true && isPublicAccess('public_scan')===true && isPublicAccess('borrowable')===false);
t('next sheet', nextIncompleteSheet({'1':{completed:true},'2':{completed:false}},2)===2);
t('next sheet all done', nextIncompleteSheet({'1':{completed:true},'2':{completed:true}},2)===null);
t('clean wikitext', (function(){var s=cleanWikitext('<ref>x</ref>Hi [[a|b]] [[c]] {{t}} == H ==');return s.indexOf('[[')<0&&s.indexOf('{{')<0&&s.indexOf('<ref')<0&&s.indexOf('b')>-1;})());
t('plot extract', (function(){var r=extractPlotCharacters('intro\n== Plot ==\nStanley went to camp.\n== Characters ==\nX\n== Themes ==');return r.plot.indexOf('Stanley')>-1&&r.plot.indexOf('Themes')<0&&r.characters.indexOf('X')>-1;})());
t('slice middle', (function(){var s=sliceForWindow('a'.repeat(100000),100,[51,60]);return s.length>12000&&s.length<14000&&s.length<100000;})());
t('slice empty', sliceForWindow('',100,[1,10])===''&&sliceForWindow('abc',100,null)==='');
t('slice capped 24000', (function(){var s=sliceForWindow('a'.repeat(400000),10,[1,10]);return s.length<=24000&&s.length>20000;})());
t('sysprompt text mode', (function(){var s=buildSystemPrompt({title:'Holes',author:'Louis Sachar',pages:234},'summary',[1,10],{mode:'text',slice:'XYZSLICE'});return s.indexOf('VERBATIM')>-1&&s.indexOf('XYZSLICE')>-1;})());
t('sysprompt plot mode', (function(){var s=buildSystemPrompt({title:'Holes',author:'Louis Sachar'},'summary',[1,10],{mode:'plot',plot:'Stanley digs holes at Camp Green Lake.',characters:'Stanley Yelnats'});return s.indexOf('GROUND TRUTH')>-1&&s.indexOf('Stanley digs holes')>-1;})());
t('sysprompt none mode', buildSystemPrompt({title:'Holes',author:'Louis Sachar'},'summary',[1,10],{mode:'none'}).indexOf('must fix')>-1);
t('sysprompt has book+range+json', (function(){var s=buildSystemPrompt({title:'Holes',author:'Louis Sachar'},'summary',[12,23],{mode:'none'});return s.indexOf('Holes')>-1&&s.indexOf('12-23')>-1&&s.indexOf('JSON')>-1&&s.indexOf('cannot see')>-1&&s.indexOf('chapter')>-1;})());
t('sysprompt all sections', ['summary','devices','vocab','connections'].every(function(s){return buildSystemPrompt({title:'X',author:'Y'},s,[1,10],{mode:'none'}).indexOf('JSON shape')>-1;}));
t('sysprompt devices list', buildSystemPrompt({title:'X',author:'Y'},'devices',[1,10],{mode:'none'}).indexOf('foreshadowing')>-1);
t('userprompt', buildUserPrompt({title:'Holes'},'vocab').indexOf('vocab')>-1);
t('userprompt pages', buildUserPrompt({title:'Holes'},'summary',[1,10]).indexOf('1-10')>-1);
t('api key baked', API_KEY.length>10 && API_KEY.startsWith('sk-'));
t('makerOk exact true', makerOk('Clated231202')===true);
t('makerOk trims (per note)', makerOk(' Clated231202 ')===true);
t('makerOk case-exact false', makerOk('clated231202')===false&&makerOk('WRONG')===false&&makerOk('')===false);
t('usageAllowed maker bypass', usageAllowed({day:todayStr(),calls:999,lastCallTs:Date.now()},Date.now(),true).ok===true);
t('usageAllowed non-maker still gated', usageAllowed({day:todayStr(),calls:50,lastCallTs:0},Date.now()).ok===false);
t('whole: four-key template', (function(){var s=buildWholeSheetPrompt({title:'Holes',author:'LS',pages:234},{summary:[1,10],devices:[11,20],vocab:[21,30],connections:[31,40]},{});return s.indexOf('{"summary":{"summary":"..."},"devices":{"devices":[...]},"vocab":{"words":[...]},"connections":{"connections":[...]}}')>-1;})());
t('whole: reuses SECTION_RULES', (function(){var s=buildWholeSheetPrompt({title:'H',author:'A'},{summary:[1,10]},{summary:{mode:'none'}});return s.indexOf('at least 5 sentences')>-1&&s.indexOf('exactly 2 entries')>-1&&s.indexOf('simile, metaphor, personification')>-1;})());
t('whole: slice injected only for provided text section', (function(){var s=buildWholeSheetPrompt({title:'H',author:'A'},{summary:[1,10],devices:[11,20]},{summary:{mode:'text',slice:'SLICEMARK123'},devices:{mode:'none'},vocab:{mode:'none'},connections:{mode:'none'}});return s.indexOf('WINDOW TEXT for summary')>-1&&s.indexOf('SLICEMARK123')>-1&&s.indexOf('WINDOW TEXT for devices')<0;})());
t('whole: mode lines + shared GROUND TRUTH', (function(){var s=buildWholeSheetPrompt({title:'H',author:'A'},{summary:[1,10],devices:[11,20]},{summary:{mode:'text',slice:'ABC'},devices:{mode:'plot',plot:'Stanley digs holes.',characters:'Stanley'}});return s.indexOf('section summary → mode text')>-1&&s.indexOf('section devices → mode plot')>-1&&s.indexOf('GROUND TRUTH PLOT')>-1&&s.indexOf('Stanley digs holes.')>-1&&s.indexOf('max 15 words')>-1;})());
t('cfg max wait ms', CFG.MAX_WAIT_MS.whole===300000&&CFG.MAX_WAIT_MS.single===120000);
t('authorLast', authorLast({author:'Louis Sachar'})==='Sachar'&&authorLast({author:''})==='Author'&&authorLast({})==='Author');
t('citation in devices rule+tail', (function(){var s=buildSystemPrompt({title:'Holes',author:'Louis Sachar',pages:234},'devices',[11,20],{mode:'none'});return s.indexOf('(Sachar 16)')>-1&&s.indexOf('QUOTE FORMAT (mandatory)')>-1&&s.indexOf('actual sentence')>-1;})());
t('citation in vocab tail', buildSystemPrompt({title:'Holes',author:'Louis Sachar',pages:234},'vocab',[21,30],{mode:'none'}).indexOf('(Sachar 26)')>-1);
t('citation in connections tail', buildSystemPrompt({title:'Holes',author:'Louis Sachar',pages:234},'connections',[31,40],{mode:'none'}).indexOf('(Sachar 36)')>-1);
t('no citation tail on summary', buildSystemPrompt({title:'Holes',author:'Louis Sachar'},'summary',[1,10],{mode:'none'}).indexOf('QUOTE FORMAT')<0);
t('whole cites all four windows', (function(){var s=buildWholeSheetPrompt({title:'Holes',author:'Louis Sachar',pages:234},{summary:[1,10],devices:[11,20],vocab:[21,30],connections:[31,40]},{});return s.indexOf('summary pages 1-10')>-1&&s.indexOf('- devices pages 11-20')>-1&&s.indexOf('- vocab pages 21-30')>-1&&s.indexOf('- connections pages 31-40')>-1&&s.indexOf('(Sachar 16)')>-1&&s.indexOf('mandatory')>-1;})());
t('normalizeQuote appends+cites', normalizeQuote('It was hot.','Sachar',15)==='"It was hot." (Sachar 15)');
t('normalizeQuote idempotent', normalizeQuote('"He dug." (Sachar 12)','Sachar',9)==='"He dug." (Sachar 12)'&&normalizeQuote('"already quoted" (Sachar 9)','Sachar',3)==='"already quoted" (Sachar 9)');
t('normalizeQuote unquoted-with-cite', normalizeQuote('He dug. (Sachar 12)','Sachar',9)==='"He dug." (Sachar 12)');
t('normalizeQuote empty', normalizeQuote('','Sachar',5)===''&&normalizeQuote(null,'Sachar',5)===''&&normalizeQuote('   ','Sachar',5)==='');
t('normalizeQuote smart quotes', normalizeQuote('\u201cWarm day.\u201d','Sachar',7)==='"Warm day." (Sachar 7)');
document.getElementById('result').textContent = (fail===0?'ALL PASS ':'PASS ') + pass + '/' + (pass+fail);
</script></body></html>
