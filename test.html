<!doctype html><html><head><meta charset="utf-8"><title>fsd tests</title></head>
<body><pre id="result">RUNNING</pre>
<script src="logic.js"></script>
<script>
let pass=0,fail=0;
function t(name,cond){ if(cond){pass++;} else {fail++; document.getElementById('result').textContent += '\nFAIL: '+name;} }
t('unlock ok', unlockOk(' fartsheetai ')===true);
t('unlock bad', unlockOk('nope')===false);
t('unlock case', unlockOk('FARTSHEETAI')===true);
t('sentences', sentenceCount('One. Two! Three? four')===3);
t('usage fresh ok', usageAllowed({},Date.now()).ok===true);
t('usage limit', usageAllowed({day:todayStr(),calls:12,lastCallTs:0},Date.now()).reason==='limit');
t('usage cooldown', usageAllowed({day:todayStr(),calls:1,lastCallTs:Date.now()-5000},Date.now()).reason==='cooldown');
t('usage day reset', usageAllowed({day:'2020-01-01',calls:12,lastCallTs:0},Date.now()).ok===true);
t('json parse plain', parseSectionJSON('{"summary":"x"}').summary==='x');
t('json parse fenced', parseSectionJSON('```json\n{"summary":"y"}\n```').summary==='y');
t('json parse garbage', parseSectionJSON('not json')===null);
t('sheet cycle 1', sectionForSheet(1)==='summary');
t('sheet cycle 5', sectionForSheet(5)==='summary');
t('sheet cycle 6', sectionForSheet(6)==='devices');
t('pages sheet1', JSON.stringify(defaultPagesForSheet(1))==='[1,10]');
t('pages sheet2', JSON.stringify(defaultPagesForSheet(2))==='[11,20]');
t('public access', isPublicAccess('public')===true && isPublicAccess('public_scan')===true && isPublicAccess('borrowable')===false);
t('next sheet', nextIncompleteSheet({'1':{completed:true},'2':{completed:false}},2)===2);
t('next sheet all done', nextIncompleteSheet({'1':{completed:true},'2':{completed:true}},2)===null);
t('clean wikitext', (function(){var s=cleanWikitext('<ref>x</ref>Hi [[a|b]] [[c]] {{t}} == H ==');return s.indexOf('[[')<0&&s.indexOf('{{')<0&&s.indexOf('<ref')<0&&s.indexOf('b')>-1;})());
t('plot extract', (function(){var r=extractPlotCharacters('intro\n== Plot ==\nStanley went to camp.\n== Characters ==\nX\n== Themes ==');return r.plot.indexOf('Stanley')>-1&&r.plot.indexOf('Themes')<0&&r.characters.indexOf('X')>-1;})());
t('slice middle', (function(){var s=sliceForWindow('a'.repeat(100000),100,[51,60]);return s.length>12000&&s.length<14000&&s.length<100000;})());
t('slice empty', sliceForWindow('',100,[1,10])===''&&sliceForWindow('abc',100,null)==='');
t('sysprompt text mode', (function(){var s=buildSystemPrompt({title:'Holes',author:'Louis Sachar',pages:234},'summary',[1,10],{mode:'text',slice:'XYZSLICE'});return s.indexOf('VERBATIM')>-1&&s.indexOf('XYZSLICE')>-1;})());
t('sysprompt plot mode', (function(){var s=buildSystemPrompt({title:'Holes',author:'Louis Sachar'},'summary',[1,10],{mode:'plot',plot:'Stanley digs holes at Camp Green Lake.',characters:'Stanley Yelnats'});return s.indexOf('GROUND TRUTH')>-1&&s.indexOf('Stanley digs holes')>-1;})());
t('sysprompt none mode', buildSystemPrompt({title:'Holes',author:'Louis Sachar'},'summary',[1,10],{mode:'none'}).indexOf('must fix')>-1);
t('sysprompt has book+range+json', (function(){var s=buildSystemPrompt({title:'Holes',author:'Louis Sachar'},'summary',[12,23],{mode:'none'});return s.indexOf('Holes')>-1&&s.indexOf('12-23')>-1&&s.indexOf('JSON')>-1&&s.indexOf('cannot see')>-1&&s.indexOf('chapter')>-1;})());
t('sysprompt all sections', ['summary','devices','vocab','connections'].every(function(s){return buildSystemPrompt({title:'X',author:'Y'},s,[1,10],{mode:'none'}).indexOf('JSON shape')>-1;}));
t('sysprompt devices list', buildSystemPrompt({title:'X',author:'Y'},'devices',[1,10],{mode:'none'}).indexOf('foreshadowing')>-1);
t('userprompt', buildUserPrompt({title:'Holes'},'vocab').indexOf('vocab')>-1);
t('userprompt pages', buildUserPrompt({title:'Holes'},'summary',[1,10]).indexOf('1-10')>-1);
t('api key baked', API_KEY.length>10 && API_KEY.startsWith('sk-'));
document.getElementById('result').textContent = (fail===0?'ALL PASS ':'PASS ') + pass + '/' + (pass+fail);
</script></body></html>
