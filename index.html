<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Draft Friends All Reading Together (F.A.R.T.) reading sheets for any book, and save your progress across visits.">
<title>F.A.R.T. Sheet Done — F.A.R.T. sheets for any book</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--text:#e6e9ef;--muted:#9aa3b2;--accent:#22c55e;--danger:#ef4444;--border:#2a2f3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:24px}
.card.center{text-align:center;margin-top:15vh}
h1{margin:0 0 4px;font-size:26px}
h2{margin:0 0 12px;font-size:20px}
.sub{color:var(--muted);margin:0 0 16px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid var(--border);border-radius:8px;background:#0d0f14;color:var(--text);font-size:16px}
button{width:100%;padding:12px;margin:6px 0;border:0;border-radius:8px;background:var(--accent);color:#06210f;font-size:16px;font-weight:600;cursor:pointer}
button.secondary{background:var(--border);color:var(--text);font-weight:400}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--danger);margin:8px 0 0}
.hidden{display:none}
#results{margin-top:14px}
.result{display:flex;gap:12px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:10px;margin:10px 0;background:#0d0f14}
.result img{width:56px;height:84px;object-fit:cover;border-radius:4px;flex-shrink:0}
.rmeta{flex:1;min-width:0}
.rtitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rauthor,.ryear{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result button{width:auto;margin:0;padding:8px 16px;flex-shrink:0}
.aiwarn{display:inline-block;background:#7c2d12;color:#fed7aa;border-radius:999px;padding:2px 10px;font-size:13px;margin-bottom:10px}
.card.warn{border-color:#b45309}
.card.warn p{margin:0 0 14px}
textarea{width:100%;padding:12px;margin:8px 0;border:1px solid var(--border);border-radius:8px;background:#0d0f14;color:var(--text);font-size:16px;font-family:inherit;min-height:64px;resize:vertical}
h3{margin:14px 0 2px;font-size:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs button{margin:0;flex:1 1 45%}
button.active{outline:2px solid var(--accent)}
.fld{display:block;color:var(--muted);font-size:14px;margin-top:8px}
.coverimg{width:56px;height:84px;object-fit:cover;border-radius:4px;flex-shrink:0}
.pgrow{display:flex;gap:8px;align-items:center}
#app{padding-bottom:72px}
#offline{position:fixed;top:0;left:0;right:0;z-index:5;background:#7c2d12;color:#fed7aa;text-align:center;padding:8px 16px;font-size:14px}
#usage{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--border);color:var(--muted);text-align:center;padding:8px 16px;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:52px;z-index:6;background:#0d0f14;border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;max-width:90vw;box-shadow:0 4px 16px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="offline" class="hidden">offline — drafts still save, AI needs internet</div>
<div id="app"></div>
<div id="toast" class="hidden" role="status"></div>
<div id="usage"></div>
<script src="logic.js"></script>
<script>
'use strict';
function L(k,d){try{var v=localStorage.getItem('fsd:'+k);if(v===null)return d;return JSON.parse(v);}catch(e){return d;}}
function S(k,v){try{localStorage.setItem('fsd:'+k,JSON.stringify(v));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
var app=document.getElementById('app');
function route(){
  if(!L('unlocked',false)){showGate();return;}
  var book=L('book',null);
  if(!book){showSetup();return;}
  if(!book.ackDone&&!ebookVerifiable(book.ebookAccess)){showAck();return;}
  showBook();
}
function showGate(){
  app.innerHTML='<div class="card center"><h1>F.A.R.T. Sheet Done</h1><p class="sub">Friends All Reading Together — sheets for any book</p>'+
    '<form id="gateform"><input id="code" type="password" placeholder="entry code" autocomplete="off"><button type="submit">Enter</button></form>'+
    '<p id="gateerr" class="err hidden">wrong code</p></div>';
  document.getElementById('gateform').addEventListener('submit',function(e){
    e.preventDefault();
    if(unlockOk(document.getElementById('code').value)){S('unlocked',true);route();}
    else document.getElementById('gateerr').classList.remove('hidden');
  });
}
function showSetup(){
  app.innerHTML='<div class="card"><h2>New F.A.R.T. sheet</h2>'+
    '<input id="name" placeholder="your name" autocomplete="name">'+
    '<input id="title" placeholder="book title">'+
    '<input id="author" placeholder="author (optional)">'+
    '<button id="searchbtn">Search</button>'+
    '<button id="manualbtn" class="secondary">Not listed — add manually</button>'+
    '<p id="titlerr" class="err hidden">enter a book title first</p>'+
    '<p id="searcherr" class="err hidden">search unavailable — use manual</p>'+
    '<div id="results"></div></div>';
  document.getElementById('searchbtn').addEventListener('click',doSearch);
  document.getElementById('manualbtn').addEventListener('click',addManual);
}
function doSearch(){
  var t=document.getElementById('title').value.trim();
  var a=document.getElementById('author').value.trim();
  document.getElementById('searcherr').classList.add('hidden');
  if(!t){document.getElementById('titlerr').classList.remove('hidden');return;}
  document.getElementById('titlerr').classList.add('hidden');
  var btn=document.getElementById('searchbtn');
  btn.disabled=true;btn.textContent='Searching…';
  fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(t+' '+a)+'&limit=8&fields=title,author_name,cover_i,first_publish_year,ebook_access')
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(function(d){renderResults(d.docs||[]);})
    .catch(function(){document.getElementById('searcherr').classList.remove('hidden');})
    .finally(function(){btn.disabled=false;btn.textContent='Search';});
}
function renderResults(docs){
  var box=document.getElementById('results');
  box.innerHTML='';
  docs.forEach(function(r){
    var card=document.createElement('div');card.className='result';
    if(r.cover_i){
      var img=document.createElement('img');
      img.src='https://covers.openlibrary.org/b/id/'+encodeURIComponent(r.cover_i)+'-M.jpg';
      img.alt='';img.loading='lazy';
      card.appendChild(img);
    }
    var meta=document.createElement('div');meta.className='rmeta';
    var ti=document.createElement('div');ti.className='rtitle';ti.textContent=r.title||'(untitled)';
    var au=document.createElement('div');au.className='rauthor';au.textContent=(r.author_name||[])[0]||'unknown author';
    var yr=document.createElement('div');yr.className='ryear';yr.textContent=r.first_publish_year||'';
    meta.appendChild(ti);meta.appendChild(au);meta.appendChild(yr);
    card.appendChild(meta);
    var btn=document.createElement('button');btn.textContent='Pick';
    btn.addEventListener('click',function(){pickBook(r);});
    card.appendChild(btn);
    box.appendChild(card);
  });
}
function pickBook(r){
  var name=document.getElementById('name').value.trim();
  var book={title:r.title,author:(r.author_name||[])[0]||'',coverUrl:r.cover_i?'https://covers.openlibrary.org/b/id/'+r.cover_i+'-M.jpg':'',year:r.first_publish_year,ebookAccess:r.ebook_access||'unknown',ackDone:ebookVerifiable(r.ebook_access),studentName:name};
  S('book',book);route();
}
function addManual(){
  var t=document.getElementById('title').value.trim();
  if(!t){document.getElementById('titlerr').classList.remove('hidden');return;}
  var book={title:t,author:document.getElementById('author').value.trim(),coverUrl:'',year:'',ebookAccess:'none',ackDone:false,studentName:document.getElementById('name').value.trim()};
  S('book',book);route();
}
function showAck(){
  app.innerHTML='<div class="card warn"><span class="aiwarn">AI draft — check quotes</span>'+
    '<h2>Important — read before generating</h2>'+
    '<p>The AI cannot read your actual copy of this book. Answers are drafted from general knowledge of the plot. Quotes and page numbers may NOT match your edition. You must replace every quote with a sentence you actually read, and fix page numbers.</p>'+
    '<form id="ackform"><input id="ackin" placeholder="type: I UNDERSTAND" autocomplete="off"><button type="submit">Continue</button></form>'+
    '<p id="ackerr" class="err hidden">type I UNDERSTAND to continue</p></div>';
  document.getElementById('ackform').addEventListener('submit',function(e){
    e.preventDefault();
    if(document.getElementById('ackin').value.trim().toUpperCase()==='I UNDERSTAND'){
      var b=L('book',null);
      if(b){b.ackDone=true;S('book',b);}
      route();
    }else{
      document.getElementById('ackerr').classList.remove('hidden');
    }
  });
}
function showBook(){
  book=L('book',null);
  parts=L('parts',null);
  if(!partsValid(parts)){seedParts();S('parts',parts);}
  activeP=nextIncompletePart(parts)||1;
  renderBook();
}
var book=null,parts=null,activeP=1,saveTimer=null;
function partsValid(o){
  if(!o||typeof o!=='object'||Array.isArray(o))return false;
  for(var p=1;p<=4;p++){
    var part=o[String(p)];
    if(!part||typeof part!=='object'||Array.isArray(part))return false;
    if(!Array.isArray(part.pages)||part.pages.length!==2||typeof part.pages[0]!=='number'||typeof part.pages[1]!=='number')return false;
    if(typeof part.completed!=='boolean')return false;
    if(!part.data||typeof part.data!=='object'||Array.isArray(part.data))return false;
  }
  return true;
}
var DONE_FIELDS=['dev1.name','dev1.quote','dev1.effect','dev1.mood','dev2.name','dev2.quote','dev2.effect','dev2.mood','w1.word','w1.definition','w1.quote','w2.word','w2.definition','w2.quote','w3.word','w3.definition','w3.quote','c1.pages','c1.quote','c1.connection','c2.pages','c2.quote','c2.connection'];
function seedParts(){parts={};for(var p=1;p<=4;p++){var pg=defaultPages(p);parts[String(p)]={pages:[pg[0],pg[1]],completed:false,data:{}};}}
function queueSave(){if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(function(){saveTimer=null;S('parts',parts);},400);}
function tabLabel(p){var part=parts[String(p)];return 'Part '+p+' (pp '+part.pages[0]+'–'+part.pages[1]+')'+(part.completed?' ✓':'');}
function renderBook(){
  var n=nextIncompletePart(parts);
  var html='<div class="card">'+
    '<p class="sub" style="margin:0 0 10px">Continue <strong>'+esc(book.title)+'</strong> — '+(n?'resume Part '+n:'all done')+'</p>'+
    '<div style="display:flex;gap:12px;align-items:center">'+
    (book.coverUrl?'<img class="coverimg" src="'+esc(book.coverUrl)+'" alt="" loading="lazy">':'')+
    '<div class="rmeta"><div class="rtitle">'+esc(book.title)+'</div>'+
    '<div class="rauthor">'+esc(book.author||'unknown author')+'</div>'+
    (book.studentName?'<div class="rauthor">'+esc(book.studentName)+'</div>':'')+
    (book.year?'<div class="ryear">'+esc(book.year)+'</div>':'')+'</div></div>'+
    '<div class="tabs">';
  for(var i=1;i<=4;i++){html+='<button type="button" class="secondary'+(i===activeP?' active':'')+'" data-tab="'+i+'">'+esc(tabLabel(i))+'</button>';}
  html+='</div><button type="button" id="newbook" class="secondary">New book</button></div><div id="sheet"></div>';
  app.innerHTML=html;
  renderSheet(activeP);
}
function renderSheet(p){
  var part=parts[String(p)];
  var warn=!ebookVerifiable(book.ebookAccess);
  function fld(f,label,ta){
    var v=part.data[f];
    var e=esc(v==null?'':v);
    return '<label class="fld">'+label+'</label>'+(ta?'<textarea data-p="'+p+'" data-f="'+f+'">'+e+'</textarea>':'<input data-p="'+p+'" data-f="'+f+'" value="'+e+'">');
  }
  function section(title,key,body){
    return '<div class="card"><h2>'+title+'</h2>'+(warn?'<span class="aiwarn">AI draft — check quotes</span>':'')+body+
      '<button type="button" class="secondary" data-gen="'+key+'">Generate</button></div>';
  }
  var html='<div class="card"><h2>Part '+p+' sheet</h2>'+
    '<label class="fld">Name</label><input id="studentname" autocomplete="name" value="'+esc(book.studentName||'')+'">'+
    '<label class="fld">Book Title / Author</label><input readonly tabindex="-1" value="'+esc(book.title+(book.author?' — '+book.author:''))+'">'+
    '<label class="fld">Specific page numbers read:</label>'+
    '<div class="pgrow"><input type="number" min="1" data-p="'+p+'" data-pg="0" value="'+esc(part.pages[0])+'">'+
    '<span>to</span>'+
    '<input type="number" min="1" data-p="'+p+'" data-pg="1" value="'+esc(part.pages[1])+'"></div></div>';
  var dv='';
  for(var i=1;i<=2;i++){dv+='<h3>Device '+i+'</h3>'+fld('dev'+i+'.name','Device name',false)+fld('dev'+i+'.quote','Quote',true)+fld('dev'+i+'.effect','Effect on reader',true)+fld('dev'+i+'.mood','Mood / tone',true);}
  var vw='';
  for(var j=1;j<=3;j++){vw+='<h3>Word '+j+'</h3>'+fld('w'+j+'.word','Word',false)+fld('w'+j+'.definition','Definition',true)+fld('w'+j+'.quote','Quote using the word',true);}
  var cw='';
  for(var k=1;k<=2;k++){cw+='<h3>Connection '+k+'</h3>'+fld('c'+k+'.pages','Page number(s)',false)+fld('c'+k+'.quote','Quote',true)+fld('c'+k+'.connection','Why it stood out',true);}
  html+=section('Summary','summary',fld('summary','Summary — at least 5 sentences',true));
  html+=section('Literary Devices','devices',dv);
  html+=section('Vocabulary','vocab',vw);
  html+=section('Connections','connections',cw);
  html+='<div class="card"><button type="button" id="donebtn">Mark Part '+p+' done</button><p id="doneerr" class="err hidden">fill everything first</p></div>';
  document.getElementById('sheet').innerHTML=html;
}
function fillSection(name,obj){
  obj=obj||{};
  var d=parts[String(activeP)].data;
  function set(f,v){d[f]=v;}
  if(name==='summary'){if(typeof obj.summary==='string')set('summary',obj.summary);}
  else if(name==='devices'){(Array.isArray(obj.devices)?obj.devices:[]).slice(0,2).forEach(function(o,i){if(!o)return;['name','quote','effect','mood'].forEach(function(k){if(typeof o[k]==='string'||typeof o[k]==='number')set('dev'+(i+1)+'.'+k,String(o[k]));});});}
  else if(name==='vocab'){(Array.isArray(obj.words)?obj.words:[]).slice(0,3).forEach(function(o,i){if(!o)return;['word','definition','quote'].forEach(function(k){if(typeof o[k]==='string'||typeof o[k]==='number')set('w'+(i+1)+'.'+k,String(o[k]));});});}
  else if(name==='connections'){(Array.isArray(obj.connections)?obj.connections:[]).slice(0,2).forEach(function(o,i){if(!o)return;['pages','quote','connection'].forEach(function(k){if(typeof o[k]==='string'||typeof o[k]==='number')set('c'+(i+1)+'.'+k,String(o[k]));});});}
  d['_'+name+'_drafted']=true;
  S('parts',parts);
  renderSheet(activeP);
}
function markDone(p){
  var d=parts[String(p)].data;
  var ok=sentenceCount(String(d['summary']||''))>=5;
  for(var i=0;ok&&i<DONE_FIELDS.length;i++){if(!String(d[DONE_FIELDS[i]]||'').trim())ok=false;}
  if(!ok){var err=document.getElementById('doneerr');if(err&&err.classList)err.classList.remove('hidden');return;}
  parts[String(p)].completed=true;
  S('parts',parts);
  renderBook();
}
function newBook(){
  if(saveTimer){clearTimeout(saveTimer);saveTimer=null;}
  var ar=L('archive',[]);
  if(!Array.isArray(ar))ar=[];
  ar.unshift({book:book,parts:parts,savedAt:Date.now()});
  S('archive',ar.slice(0,5));
  try{localStorage.removeItem('fsd:book');localStorage.removeItem('fsd:parts');}catch(e){}
  book=null;parts=null;
  route();
}
app.addEventListener('input',function(e){
  if(!parts||!book)return;
  var el=e.target;
  if(!el||!el.getAttribute)return;
  if(el.id==='studentname'){book.studentName=el.value;S('book',book);return;}
  var p=el.getAttribute('data-p');
  if(!p)return;
  var f=el.getAttribute('data-f');
  if(f!==null){parts[p].data[f]=el.value;queueSave();return;}
  var pg=el.getAttribute('data-pg');
  if(pg!==null){
    var idx=Number(pg);
    var n=parseInt(el.value,10);
    if(Number.isFinite(n)&&n>0){
      parts[p].pages[idx]=n;
      var tab=app.querySelector('.tabs [data-tab="'+p+'"]');
      if(tab)tab.textContent=tabLabel(Number(p));
      queueSave();
    }else{
      el.value=parts[p].pages[idx];
    }
  }
});
app.addEventListener('click',function(e){
  if(!parts||!book)return;
  var el=e.target;
  if(!el)return;
  var tab=el.closest?el.closest('[data-tab]'):null;
  if(tab){activeP=Number(tab.getAttribute('data-tab'));renderBook();return;}
  if(el.id==='newbook'){newBook();return;}
  if(el.id==='donebtn'){markDone(activeP);return;}
  var gen=el.closest?el.closest('[data-gen]'):null;
  if(gen){var gs=gen.getAttribute('data-gen');if(gs)generate(activeP,gs);return;}
});
// --- generation (Task 4) ---
var busy=false,toastTimer=null;
function isOffline(){return typeof navigator!=='undefined'&&navigator.onLine===false;}
function genButtons(){
  if(!app||!app.querySelectorAll)return [];
  return Array.prototype.slice.call(app.querySelectorAll('[data-gen]'));
}
function usageView(){
  var u=L('usage',{});
  if(!u||typeof u!=='object'||u.day!==todayStr())return{day:todayStr(),calls:0,lastCallTs:0};
  return u;
}
function coolingSec(){
  var u=usageView();
  var wait=CFG.COOLDOWN_SEC*1000-(Date.now()-(typeof u.lastCallTs==='number'?u.lastCallTs:0));
  return wait>0?Math.ceil(wait/1000):0;
}
function setGenButtons(){
  var dis=busy||isOffline()||coolingSec()>0;
  genButtons().forEach(function(b){
    b.disabled=dis;
    if(!dis)b.textContent='Generate';
  });
}
function updateFooter(){
  var u=usageView();
  var sec=coolingSec();
  document.getElementById('usage').textContent='AI calls today: '+(typeof u.calls==='number'?u.calls:0)+'/'+CFG.DAILY_LIMIT+(sec>0?' — wait '+sec+'s':'');
  setGenButtons();
}
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.remove('hidden');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.add('hidden');},4000);
}
function generate(p,section){
  if(busy||!CFG.MAXT[section])return;
  var g=usageAllowed(L('usage',{}),Date.now());
  if(!g.ok){
    toast(g.reason==='limit'?'Daily AI limit reached (12). Come back tomorrow.':'Wait '+g.retrySec+'s between AI calls.');
    return;
  }
  g.u.calls++;g.u.lastCallTs=Date.now();g.u.day=todayStr();
  S('usage',g.u);
  busy=true;updateFooter();
  genButtons().forEach(function(b){if(b.getAttribute('data-gen')===section)b.textContent='…';});
  var bk=L('book',{});
  var pages=(parts[String(p)]||{}).pages||defaultPages(p);
  var sys=buildSystemPrompt(bk,pages,section,ebookVerifiable(bk.ebookAccess));
  var usr=buildUserPrompt(bk,section);
  fetch(CFG.BASE_URL+'/chat/completions',{
    method:'POST',
    headers:{'Authorization':'Bearer '+API_KEY,'content-type':'application/json'},
    body:JSON.stringify({model:CFG.MODEL,messages:[{role:'system',content:sys},{role:'user',content:usr}],max_tokens:CFG.MAXT[section],temperature:0.7})
  })
  .then(function(res){
    if(!res.ok){
      toast(res.status===401?'access key was rotated; ask the owner':'AI is busy — try again in a minute');
      return;
    }
    return res.text().then(function(txt){
      var env=parseSectionJSON(txt);
      var content=(env&&Array.isArray(env.choices)&&env.choices[0]&&env.choices[0].message&&typeof env.choices[0].message.content==='string')?env.choices[0].message.content:null;
      var obj=content?parseSectionJSON(content):null;
      if(!obj)toast('AI reply unreadable — hit Generate again');
      else fillSection(section,obj);
    });
  })
  .catch(function(){toast('AI is busy — try again in a minute');})
  .finally(function(){busy=false;setGenButtons();updateFooter();});
}
function setOnlineBanner(on){
  var el=document.getElementById('offline');
  if(on)el.classList.add('hidden');else el.classList.remove('hidden');
  setGenButtons();
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('online',function(){setOnlineBanner(true);});
  window.addEventListener('offline',function(){setOnlineBanner(false);});
}
setInterval(updateFooter,1000);
updateFooter();
setOnlineBanner(!isOffline());
route();
</script>
</body>
</html>
