<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Draft Friends All Reading Together (F.A.R.T.) reading sheets for any book, and save your progress across visits.">
<title>F.A.R.T. Sheet Done — F.A.R.T. sheets for any book</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--text:#e6e9ef;--muted:#9aa3b2;--accent:#22c55e;--danger:#ef4444;--border:#2a2f3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:24px}
.card.center{text-align:center;margin-top:15vh}
h1{margin:0 0 4px;font-size:26px}
h2{margin:0 0 12px;font-size:20px}
.sub{color:var(--muted);margin:0 0 16px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid var(--border);border-radius:8px;background:#0d0f14;color:var(--text);font-size:16px}
button{width:100%;padding:12px;margin:6px 0;border:0;border-radius:8px;background:var(--accent);color:#06210f;font-size:16px;font-weight:600;cursor:pointer}
button.secondary{background:var(--border);color:var(--text);font-weight:400}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--danger);margin:8px 0 0}
.hidden{display:none}
#results{margin-top:14px}
.result{display:flex;gap:12px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:10px;margin:10px 0;background:#0d0f14}
.result img{width:56px;height:84px;object-fit:cover;border-radius:4px;flex-shrink:0}
.rmeta{flex:1;min-width:0}
.rtitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rauthor,.ryear{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result button{width:auto;margin:0;padding:8px 16px;flex-shrink:0}
.aiwarn{display:inline-block;background:#7c2d12;color:#fed7aa;border-radius:999px;padding:2px 10px;font-size:13px;margin-bottom:10px}
.card.warn{border-color:#b45309}
.card.warn p{margin:0 0 14px}
textarea{width:100%;padding:12px;margin:8px 0;border:1px solid var(--border);border-radius:8px;background:#0d0f14;color:var(--text);font-size:16px;font-family:inherit;min-height:64px;resize:vertical}
h3{margin:14px 0 2px;font-size:16px}
button.active{outline:2px solid var(--accent)}
.fld{display:block;color:var(--muted);font-size:14px;margin-top:8px}
.coverimg{width:56px;height:84px;object-fit:cover;border-radius:4px;flex-shrink:0}
.pgrow{display:flex;gap:8px;align-items:center}
.sheetlist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.sheetlist button{text-align:left}
.chip{display:inline-block;background:#14532d;color:#bbf7d0;border-radius:999px;padding:2px 10px;font-size:13px;margin:10px 6px 0 0}
#app{padding-bottom:72px}
#offline{position:fixed;top:0;left:0;right:0;z-index:5;background:#7c2d12;color:#fed7aa;text-align:center;padding:8px 16px;font-size:14px}
.makerrow{margin-top:12px;text-align:center;font-size:13px;color:var(--muted)}
.makerrow input{width:120px;display:inline-block;margin:0;padding:6px}
.makerrow button{width:auto;display:inline-block;margin:0;padding:6px 12px;font-size:13px;font-weight:400}
.thinking{display:block;color:var(--muted);font-size:14px;margin-top:4px}
#usage{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--border);color:var(--muted);text-align:center;padding:8px 16px;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:52px;z-index:6;background:#0d0f14;border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;max-width:90vw;box-shadow:0 4px 16px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="offline" class="hidden">offline — drafts still save, AI needs internet</div>
<div id="app"></div>
<div id="toast" class="hidden" role="status"></div>
<div id="usage"></div>
<script src="logic.js"></script>
<script>
'use strict';
function L(k,d){try{var v=localStorage.getItem('fsd:'+k);if(v===null)return d;return JSON.parse(v);}catch(e){return d;}}
function S(k,v){try{localStorage.setItem('fsd:'+k,JSON.stringify(v));}catch(e){try{toast('Storage is full — use New book to archive old runs');}catch(e2){}}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function bookKeyOf(b){return String((b&&b.title)||'')+'|'+String((b&&b.author)||'');}
function normalIa(ia){if(Array.isArray(ia))return ia.filter(Boolean).slice(0,3);if(typeof ia==='string'&&ia)return[ia];return[];}
var SECTIONS={summary:'Summary',devices:'Literary Devices',vocab:'Vocabulary',connections:'Connections'};
var SECKEYS=['summary','devices','vocab','connections'];
var SECTION_FIELDS={
  summary:['summary'],
  devices:['dev1.name','dev1.quote','dev1.effect','dev1.mood','dev2.name','dev2.quote','dev2.effect','dev2.mood'],
  vocab:['w1.word','w1.definition','w1.quote','w2.word','w2.definition','w2.quote','w3.word','w3.definition','w3.quote'],
  connections:['c1.pages','c1.quote','c1.connection','c2.pages','c2.quote','c2.connection']
};
var ALLFIELDS=SECTION_FIELDS.summary.concat(SECTION_FIELDS.devices,SECTION_FIELDS.vocab,SECTION_FIELDS.connections);
var app=document.getElementById('app');
var book=null,sheets=null,activeS=1,saveTimer=null,MAKER=L('maker',false);
function route(){
  if(!L('unlocked',false)){showGate();return;}
  var b=L('book',null);
  if(!b){showSetup();return;}
  if(!b.ackDone){showAck();return;}
  showBook();
}
function makerRowHtml(){
  if(MAKER)return '<div class="makerrow"><span class="chip">★ MAKER MODE — unlimited</span> <button type="button" class="secondary" data-mk="exit">Exit</button></div>';
  return '<div class="makerrow">Are you the maker? <input class="makerin" type="password" autocomplete="off"> <button type="button" class="secondary" data-mk="unlock">Unlock</button></div>';
}
function showGate(){
  app.innerHTML='<div class="card center"><h1>F.A.R.T. Sheet Done</h1><p class="sub">Friends All Reading Together — sheets for any book</p>'+
    '<form id="gateform"><input id="code" type="password" placeholder="entry code" autocomplete="off"><button type="submit">Enter</button></form>'+
    '<p id="gateerr" class="err hidden">wrong code</p>'+makerRowHtml()+'</div>';
  document.getElementById('gateform').addEventListener('submit',function(e){
    e.preventDefault();
    if(unlockOk(document.getElementById('code').value)){S('unlocked',true);route();}
    else document.getElementById('gateerr').classList.remove('hidden');
  });
}
function showSetup(){
  app.innerHTML='<div class="card"><h2>New F.A.R.T. sheet</h2>'+
    '<input id="name" placeholder="your name" autocomplete="name">'+
    '<label class="fld">I have read up to page:</label>'+
    '<input id="startpg" type="number" min="0" value="0" placeholder="0 = from the start">'+
    '<input id="title" placeholder="book title">'+
    '<input id="author" placeholder="author (optional)">'+
    '<button id="searchbtn">Search</button>'+
    '<button id="manualbtn" class="secondary">Not listed — add manually</button>'+
    '<p id="titlerr" class="err hidden">enter a book title first</p>'+
    '<p id="searcherr" class="err hidden">search unavailable — use manual</p>'+
    '<div id="results"></div></div>';
  document.getElementById('searchbtn').addEventListener('click',doSearch);
  document.getElementById('manualbtn').addEventListener('click',addManual);
}
function doSearch(){
  var t=document.getElementById('title').value.trim();
  var a=document.getElementById('author').value.trim();
  document.getElementById('searcherr').classList.add('hidden');
  if(!t){document.getElementById('titlerr').classList.remove('hidden');return;}
  document.getElementById('titlerr').classList.add('hidden');
  var btn=document.getElementById('searchbtn');
  btn.disabled=true;btn.textContent='Searching…';
  fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(t+' '+a)+'&limit=8&fields=title,author_name,cover_i,first_publish_year,ebook_access,number_of_pages_median,ia')
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(function(d){renderResults(d.docs||[]);})
    .catch(function(){document.getElementById('searcherr').classList.remove('hidden');})
    .finally(function(){btn.disabled=false;btn.textContent='Search';});
}
function renderResults(docs){
  var box=document.getElementById('results');
  box.innerHTML='';
  docs.forEach(function(r){
    var card=document.createElement('div');card.className='result';
    if(r.cover_i){
      var img=document.createElement('img');
      img.src='https://covers.openlibrary.org/b/id/'+encodeURIComponent(r.cover_i)+'-M.jpg';
      img.alt='';img.loading='lazy';
      card.appendChild(img);
    }
    var meta=document.createElement('div');meta.className='rmeta';
    var ti=document.createElement('div');ti.className='rtitle';ti.textContent=r.title||'(untitled)';
    var au=document.createElement('div');au.className='rauthor';au.textContent=(r.author_name||[])[0]||'unknown author';
    var yr=document.createElement('div');yr.className='ryear';yr.textContent=r.first_publish_year||'';
    meta.appendChild(ti);meta.appendChild(au);meta.appendChild(yr);
    card.appendChild(meta);
    var btn=document.createElement('button');btn.textContent='Pick';
    btn.addEventListener('click',function(){pickBook(r);});
    card.appendChild(btn);
    box.appendChild(card);
  });
}
function pickBook(r){
  var name=document.getElementById('name').value.trim();
  var b={title:r.title,author:(r.author_name||[])[0]||'',coverUrl:r.cover_i?'https://covers.openlibrary.org/b/id/'+r.cover_i+'-M.jpg':'',year:r.first_publish_year,ebookAccess:r.ebook_access||'unknown',ackDone:false,studentName:name,pages:Number(r.number_of_pages_median)||0,iaIds:normalIa(r.ia),ground:null,startPage:readStartPage()};
  S('book',b);S('booktext',null);route();
}
function addManual(){
  var t=document.getElementById('title').value.trim();
  if(!t){document.getElementById('titlerr').classList.remove('hidden');return;}
  var b={title:t,author:document.getElementById('author').value.trim(),coverUrl:'',year:'',ebookAccess:'none',ackDone:false,studentName:document.getElementById('name').value.trim(),pages:0,iaIds:[],ground:null,startPage:readStartPage()};
  S('book',b);S('booktext',null);route();
}
function readStartPage(){var el=document.getElementById('startpg');var v=el?parseInt(el.value,10):0;if(!Number.isFinite(v)||v<0)v=0;return Math.max(1,v+1);}
function booktextFor(b){var bt=L('booktext',null);return(bt&&bt.text&&bt.bookKey===bookKeyOf(b))?bt:null;}
function groundingMode(b){if(booktextFor(b))return'text';if(b&&b.ground&&b.ground.plot)return'plot';return'none';}
function showAck(){
  var b=L('book',null);
  var m=b?groundingMode(b):'none';
  var msg=m==='text'
    ?'Real book text is loaded — quotes come straight from it, but page numbers differ per edition: check them against YOUR copy.'
    :m==='plot'
    ?'Characters and events are pulled from the book’s real plot. Quotes are close paraphrases: replace them with the exact sentences from your copy and fix page numbers.'
    :'The AI cannot read your actual copy of this book. Answers are drafted from general knowledge of the plot. Quotes and page numbers may NOT match your edition. You must replace every quote with a sentence you actually read, and fix page numbers.';
  app.innerHTML='<div class="card warn"><span class="aiwarn">AI draft — check quotes</span>'+
    '<h2>Important — read before generating</h2>'+
    '<p>'+msg+'</p>'+
    '<form id="ackform"><input id="ackin" placeholder="type: I UNDERSTAND" autocomplete="off"><button type="submit">Continue</button></form>'+
    '<p id="ackerr" class="err hidden">type I UNDERSTAND to continue</p></div>';
  document.getElementById('ackform').addEventListener('submit',function(e){
    e.preventDefault();
    if(document.getElementById('ackin').value.trim().toUpperCase()==='I UNDERSTAND'){
      var bk=L('book',null);
      if(bk){bk.ackDone=true;S('book',bk);}
      route();
    }else{
      document.getElementById('ackerr').classList.remove('hidden');
    }
  });
}
// --- grounding (free fetches, no AI key spent) ---
var groundingKey=null;
function startGrounding(){
  var key=bookKeyOf(book);
  if(groundingKey===key)return;
  groundingKey=key;
  if(!(book.ground&&String(book.ground.plot||'').length>200))wikiGround();
  if(!booktextFor(book)&&isPublicAccess(book.ebookAccess)&&(book.iaIds||[]).length)textGround();
  updateChips();
}
function wikiGround(){
  var b=book;
  var q=encodeURIComponent(String(b.title||'')+' '+(b.author||'')+' novel');
  fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch='+q+'&format=json&origin=*&srlimit=1')
  .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
  .then(function(d){
    var hit=d&&d.query&&Array.isArray(d.query.search)?d.query.search[0]:null;
    if(!hit||!hit.title)throw new Error('no wiki match');
    return fetch('https://en.wikipedia.org/w/api.php?action=parse&page='+encodeURIComponent(hit.title)+'&prop=wikitext&format=json&origin=*&redirects=1')
      .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
      .then(function(p){
        var wt=p&&p.parse&&p.parse.wikitext?(p.parse.wikitext['*']||p.parse.wikitext.value||''):'';
        var ex=extractPlotCharacters(wt);
        b.ground={plot:String(ex.plot||'').slice(0,12000),chars:String(ex.characters||'').slice(0,4000),wikiTitle:hit.title};
        S('book',b);refreshBadges();
      });
  })
  .catch(function(){b.ground={plot:''};S('book',b);refreshBadges();});
}
function textGround(){
  var b=book,ids=(b.iaIds||[]).slice(0,3),key=bookKeyOf(b);
  (function tryOne(i){
    if(i>=ids.length)return;
    fetch('https://archive.org/download/'+encodeURIComponent(ids[i])+'/'+encodeURIComponent(ids[i])+'_djvu.txt')
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.text();})
    .then(function(t){
      if(t&&t.length>50000){S('booktext',{id:ids[i],bookKey:key,text:t.slice(0,400000)});refreshBadges();}
      else tryOne(i+1);
    })
    .catch(function(){tryOne(i+1);});
  })(0);
}
function updateChips(){
  var el=document.getElementById('gchips');
  if(!el||!book)return;
  var h='';
  if(book.ground&&book.ground.plot)h+='<span class="chip">PLOT-GROUNDED ✓</span>';
  if(booktextFor(book))h+='<span class="chip">REAL TEXT ✓</span>';
  el.innerHTML=h;
}
function sectionMode(s,sec){
  if(s&&s.data&&typeof s.data['_'+sec+'_mode']==='string')return s.data['_'+sec+'_mode'];
  return groundingMode(book);
}
function refreshBadges(){
  if(book){
    var s=sheets&&sheets[String(activeS)];
    SECKEYS.forEach(function(sec){
      var w=document.getElementById('warnslot-'+sec);
      if(w)w.innerHTML=sectionMode(s,sec)==='text'?'':'<span class="aiwarn">AI draft — check quotes</span>';
    });
  }
  updateChips();
}
// --- sheets (v3: one sheet, four section-windows) ---
function showBook(){
  book=L('book',null);
  sheets=L('sheets',null);
  if(!sheetsValid(sheets)){seedSheets(book.startPage||1);S('sheets',sheets);}
  activeS=nextIncompleteSheet(sheets,sheetCount())||sheetCount();
  renderBook();
  startGrounding();
}
function sheetsValid(o){
  if(!o||typeof o!=='object'||Array.isArray(o))return false;
  var ks=Object.keys(o);
  if(!ks.length)return false;
  for(var n=1;n<=ks.length;n++){
    var s=o[String(n)];
    if(!s||typeof s!=='object'||Array.isArray(s))return false;
    if(!s.windows||typeof s.windows!=='object'||Array.isArray(s.windows))return false;
    for(var q=0;q<SECKEYS.length;q++){
      var w=s.windows[SECKEYS[q]];
      if(!Array.isArray(w)||w.length!==2||typeof w[0]!=='number'||typeof w[1]!=='number')return false;
    }
    if(typeof s.completed!=='boolean')return false;
    if(!s.data||typeof s.data!=='object'||Array.isArray(s.data))return false;
  }
  return true;
}
function seedSheets(sp){sheets={};for(var n=1;n<=4;n++){sheets[String(n)]={windows:sheetWindowsForSheet(n,sp||1),completed:false,data:{}};}}
function sheetCount(){var m=0;Object.keys(sheets||{}).forEach(function(k){var n=parseInt(k,10);if(n>m)m=n;});return m;}
function nextBase(){return (Number(book&&book.startPage)||1)+40*sheetCount();}
function bookFinished(){return book&&Number(book.pages)>0&&nextBase()>Number(book.pages);}
function queueSave(){if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(function(){saveTimer=null;S('sheets',sheets);},400);}
function sheetLabel(n){var s=sheets[String(n)];var w=s.windows;return 'Sheet '+n+' (pp '+w.summary[0]+'–'+w.connections[1]+')'+(s.completed?' ✓':'');}
function renderBook(){
  var count=sheetCount();
  var n=nextIncompleteSheet(sheets,count+1);
  if(n&&n>count&&bookFinished())n=nextIncompleteSheet(sheets,count);
  var html='<div class="card">'+
    '<p class="sub" style="margin:0 0 10px">Continue <strong>'+esc(book.title)+'</strong> — '+(n?'Sheet '+n:'all done')+'</p>'+
    '<div style="display:flex;gap:12px;align-items:center">'+
    (book.coverUrl?'<img class="coverimg" src="'+esc(book.coverUrl)+'" alt="" loading="lazy">':'')+
    '<div class="rmeta"><div class="rtitle">'+esc(book.title)+'</div>'+
    '<div class="rauthor">'+esc(book.author||'unknown author')+'</div>'+
    (book.studentName?'<div class="rauthor">'+esc(book.studentName)+'</div>':'')+
    (book.year?'<div class="ryear">'+esc(book.year)+'</div>':'')+'</div></div>'+
    '<div id="gchips"></div>'+
    makerRowHtml()+
    '<div class="sheetlist">';
  for(var i=1;i<=count;i++){html+='<button type="button" class="secondary sheetrow'+(i===activeS?' active':'')+'" data-sheet="'+i+'">'+esc(sheetLabel(i))+'</button>';}
  html+='</div>'+
    '<button type="button" id="addsheet" class="secondary"'+(bookFinished()?' disabled':'')+'>'+(bookFinished()?'🎉 Book finished':'Add next sheet')+'</button>'+
    '<button type="button" id="newbook" class="secondary">New book</button></div><div id="sheet"></div>';
  app.innerHTML=html;
  updateChips();
  renderEditor(activeS);
}
function renderEditor(n){
  var s=sheets[String(n)];
  if(!s)return;
  function fld(f,label,ta){
    var v=s.data[f];
    var e=esc(v==null?'':v);
    return '<label class="fld">'+label+'</label>'+(ta?'<textarea data-s="'+n+'" data-f="'+f+'">'+e+'</textarea>':'<input data-s="'+n+'" data-f="'+f+'" value="'+e+'">');
  }
  var html='<div class="card"><h2>Sheet '+n+'</h2>'+
    '<label class="fld">Name</label><input id="studentname" autocomplete="name" value="'+esc(book.studentName||'')+'">'+
    '<label class="fld">Book Title / Author</label><input readonly tabindex="-1" value="'+esc(book.title+(book.author?' — '+book.author:''))+'"></div>'+
    '<div class="card"><button type="button" data-gen="whole">⚡ Generate whole sheet</button>'+
    '<p class="sub" style="margin:6px 0 0">All four sections in one AI call.</p></div>';
  function secCard(sec,body){
    var w=s.windows[sec];
    return '<div class="card"><h2>'+esc(SECTIONS[sec])+'</h2>'+
      '<span id="warnslot-'+sec+'">'+(sectionMode(s,sec)==='text'?'':'<span class="aiwarn">AI draft — check quotes</span>')+'</span>'+
      '<label class="fld">Specific page numbers read:</label>'+
      '<div class="pgrow"><input type="number" min="1" data-p="'+n+'" data-sec="'+sec+'" data-pg="0" value="'+esc(w[0])+'">'+
      '<span>to</span>'+
      '<input type="number" min="1" data-p="'+n+'" data-sec="'+sec+'" data-pg="1" value="'+esc(w[1])+'"></div>'+
      body+
      '<button type="button" class="secondary" data-gen="'+sec+'">Generate</button></div>';
  }
  var dv='';
  for(var i=1;i<=2;i++){dv+='<h3>Device '+i+'</h3>'+fld('dev'+i+'.name','Device name',false)+fld('dev'+i+'.quote','Quote',true)+fld('dev'+i+'.effect','Effect on reader',true)+fld('dev'+i+'.mood','Mood / tone',true);}
  var vw='';
  for(var j=1;j<=3;j++){vw+='<h3>Word '+j+'</h3>'+fld('w'+j+'.word','Word',false)+fld('w'+j+'.definition','Definition',true)+fld('w'+j+'.quote','Quote using the word',true);}
  var cw='';
  for(var k=1;k<=2;k++){cw+='<h3>Connection '+k+'</h3>'+fld('c'+k+'.pages','Page number(s)',false)+fld('c'+k+'.quote','Quote',true)+fld('c'+k+'.connection','Why it stood out',true);}
  html+=secCard('summary',fld('summary','Summary — at least 5 sentences',true));
  html+=secCard('devices',dv);
  html+=secCard('vocab',vw);
  html+=secCard('connections',cw);
  html+='<div class="card"><button type="button" id="donebtn">Mark Sheet '+n+' done</button><p id="doneerr" class="err hidden">fill everything first</p></div>';
  document.getElementById('sheet').innerHTML=html;
}
function fillSheet(p,name,obj,usedMode){
  obj=obj||{};
  var sh=sheets[String(p)];
  if(!sh||SECKEYS.indexOf(name)<0)return;
  var d=sh.data;
  function set(f,v){d[f]=v;}
  if(name==='summary'){if(typeof obj.summary==='string')set('summary',obj.summary);}
  else if(name==='devices'){(Array.isArray(obj.devices)?obj.devices:[]).slice(0,2).forEach(function(o,i){if(!o)return;['name','quote','effect','mood'].forEach(function(k){if(typeof o[k]==='string'||typeof o[k]==='number')set('dev'+(i+1)+'.'+k,String(o[k]));});});}
  else if(name==='vocab'){(Array.isArray(obj.words)?obj.words:[]).slice(0,3).forEach(function(o,i){if(!o)return;['word','definition','quote'].forEach(function(k){if(typeof o[k]==='string'||typeof o[k]==='number')set('w'+(i+1)+'.'+k,String(o[k]));});});}
  else if(name==='connections'){(Array.isArray(obj.connections)?obj.connections:[]).slice(0,2).forEach(function(o,i){if(!o)return;['pages','quote','connection'].forEach(function(k){if(typeof o[k]==='string'||typeof o[k]==='number')set('c'+(i+1)+'.'+k,String(o[k]));});});}
  d['_'+name+'_drafted']=true;
  if(usedMode)d['_'+name+'_mode']=usedMode;
  S('sheets',sheets);
  if(Number(p)===Number(activeS))renderEditor(Number(p));
}
function markDone(n){
  var s=sheets[String(n)];
  if(!s)return;
  var d=s.data;
  var ok=sentenceCount(String(d['summary']||''))>=5;
  for(var i=0;ok&&i<ALLFIELDS.length;i++){if(!String(d[ALLFIELDS[i]]||'').trim())ok=false;}
  if(!ok){var err=document.getElementById('doneerr');if(err&&err.classList)err.classList.remove('hidden');return;}
  s.completed=true;
  S('sheets',sheets);
  renderBook();
}
function addSheet(){
  if(bookFinished())return;
  var n=sheetCount()+1;
  sheets[String(n)]={windows:sheetWindowsForSheet(n,(book&&book.startPage)||1),completed:false,data:{}};
  S('sheets',sheets);
  activeS=n;
  renderBook();
}
function newBook(){
  if(saveTimer){clearTimeout(saveTimer);saveTimer=null;}
  var ar=L('archive',[]);
  if(!Array.isArray(ar))ar=[];
  ar.unshift({book:book,sheets:sheets,savedAt:Date.now()});
  S('archive',ar.slice(0,5));
  try{localStorage.removeItem('fsd:book');localStorage.removeItem('fsd:sheets');localStorage.removeItem('fsd:booktext');}catch(e){}
  book=null;sheets=null;
  route();
}
app.addEventListener('input',function(e){
  if(!sheets||!book)return;
  var el=e.target;
  if(!el||!el.getAttribute)return;
  if(el.id==='studentname'){book.studentName=el.value;S('book',book);return;}
  var sn=el.getAttribute('data-s')||el.getAttribute('data-p');
  if(!sn)return;
  var sh=sheets[sn];
  if(!sh)return;
  var f=el.getAttribute('data-f');
  if(f!==null){sh.data[f]=el.value;queueSave();return;}
  var pg=el.getAttribute('data-pg');
  if(pg!==null){
    var sec=el.getAttribute('data-sec');
    var w=sec&&sh.windows?sh.windows[sec]:null;
    if(!w)return;
    var idx=Number(pg);
    var n=parseInt(el.value,10);
    if(Number.isFinite(n)&&n>0){
      w[idx]=n;
      var row=app.querySelector?app.querySelector('.sheetrow[data-sheet="'+sn+'"]'):null;
      if(row)row.textContent=sheetLabel(Number(sn));
      queueSave();
    }else{
      el.value=w[idx];
    }
  }
});
app.addEventListener('click',function(e){
  var el=e.target;
  if(!el)return;
  var mk=el.getAttribute?el.getAttribute('data-mk'):null;
  if(mk==='unlock'){
    var inp=el.parentNode&&el.parentNode.querySelector?el.parentNode.querySelector('.makerin'):null;
    if(makerOk(inp&&inp.value)){S('maker',true);MAKER=true;route();updateFooter();}
    else toast('wrong maker code');
    return;
  }
  if(mk==='exit'){S('maker',false);MAKER=false;route();updateFooter();return;}
  if(!sheets||!book)return;
  var row=el.closest?el.closest('[data-sheet]'):null;
  if(row){activeS=Number(row.getAttribute('data-sheet'));renderBook();return;}
  if(el.id==='newbook'){newBook();return;}
  if(el.id==='addsheet'){addSheet();return;}
  if(el.id==='donebtn'){markDone(activeS);return;}
  var gen=el.closest?el.closest('[data-gen]'):null;
  if(gen){var gs=gen.getAttribute('data-gen');if(gs==='whole'){generateWhole(activeS);return;}if(gs)generate(activeS,gs);return;}
});
// --- generation (Task 4) ---
var busy=false,toastTimer=null;
function isOffline(){return typeof navigator!=='undefined'&&navigator.onLine===false;}
function genButtons(){
  if(!app||!app.querySelectorAll)return [];
  return Array.prototype.slice.call(app.querySelectorAll('[data-gen]'));
}
function usageView(){
  var u=L('usage',{});
  if(!u||typeof u!=='object'||u.day!==todayStr())return{day:todayStr(),calls:0,lastCallTs:0};
  return u;
}
function coolingSec(){
  var u=usageView();
  var wait=CFG.COOLDOWN_SEC*1000-(Date.now()-(typeof u.lastCallTs==='number'?u.lastCallTs:0));
  return wait>0?Math.ceil(wait/1000):0;
}
function setGenButtons(){
  var dis=busy||isOffline()||(MAKER?false:coolingSec()>0);
  genButtons().forEach(function(b){
    b.disabled=dis;
    if(!dis)b.textContent='Generate';
  });
}
function updateFooter(){
  var u=usageView();
  var calls=typeof u.calls==='number'?u.calls:0;
  var sec=MAKER?0:coolingSec();
  document.getElementById('usage').textContent=(MAKER?'★ MAKER MODE — unlimited · AI calls today: '+calls+' · maker':'AI calls today: '+calls+'/'+CFG.DAILY_LIMIT)+(sec>0?' — wait '+sec+'s':'');
  setGenButtons();
}
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.remove('hidden');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.add('hidden');},8000);
}
var thinkingEl=null;
function guardedFetch(url,opts,ms,onTimeout){
  var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  if(ctrl){opts=Object.assign({},opts,{signal:ctrl.signal});}
  var timer=null;
  if(ctrl&&ms>0){timer=setTimeout(function(){onTimeout();ctrl.abort();},ms);}
  return fetch(url,opts).finally(function(){if(timer)clearTimeout(timer);});
}
function clearThinking(){
  if(thinkingEl&&thinkingEl.parentNode&&thinkingEl.parentNode.removeChild)thinkingEl.parentNode.removeChild(thinkingEl);
  thinkingEl=null;
}
function setThinking(btn){
  clearThinking();
  thinkingEl=document.createElement('span');
  thinkingEl.className='thinking';
  thinkingEl.textContent='AI is thinking…';
  if(btn&&btn.parentNode&&btn.parentNode.insertBefore)btn.parentNode.insertBefore(thinkingEl,btn.nextSibling);
}
function sectionGrounding(bk,win){
  var mode=groundingMode(bk);
  var slice='';
  if(mode==='text'){
    slice=sliceForWindow(booktextFor(bk).text,Number(bk.pages)||0,win);
    if(slice.length<500)mode=(bk.ground&&String(bk.ground.plot||'').length>200)?'plot':'none';
  }
  return{mode:mode,slice:slice};
}
function generate(p,section){
  if(busy||!CFG.MAXT[section])return;
  var g=usageAllowed(L('usage',{}),Date.now(),MAKER);
  if(!g.ok){
    toast(g.reason==='limit'?'Daily AI limit reached ('+CFG.DAILY_LIMIT+'). Come back tomorrow.':'Wait '+g.retrySec+'s between AI calls — the button unlocks itself.');
    return;
  }
  g.u.calls++;g.u.lastCallTs=Date.now();g.u.day=todayStr();
  S('usage',g.u);
  busy=true;updateFooter();
  genButtons().forEach(function(b){
    if(b.getAttribute('data-gen')===section){b.textContent='…';setThinking(b);}
  });
  var bk=L('book',{});
  var sh=sheets[String(p)]||{};
  var win=(sh.windows&&sh.windows[section])||defaultPagesForSheet(1,bk.startPage||1);
  var gd=sectionGrounding(bk,win);
  var mode=gd.mode;
  var grounding={mode:mode};
  if(mode==='text'){grounding.slice=gd.slice;}
  if(mode==='plot'){grounding.plot=bk.ground.plot;grounding.characters=bk.ground.chars;}
  var sys=buildSystemPrompt(bk,section,win,grounding);
  var usr=buildUserPrompt(bk,section,win);
  var timedOut=false;
  guardedFetch(CFG.BASE_URL+'/chat/completions',{
    method:'POST',
    headers:{'Authorization':'Bearer '+API_KEY,'content-type':'application/json'},
    body:JSON.stringify({model:CFG.MODEL,messages:[{role:'system',content:sys},{role:'user',content:usr}],max_tokens:CFG.MAXT[section],temperature:0.7})
  },section==='whole'?CFG.MAX_WAIT_MS.whole:CFG.MAX_WAIT_MS.single,function(){timedOut=true;})
  .then(function(res){
    if(!res.ok){
      toast(res.status===401?'access key was rotated; ask the owner':'AI is busy — try again in a minute');
      return;
    }
    return res.text().then(function(txt){
      var env=parseSectionJSON(txt);
      var content=(env&&Array.isArray(env.choices)&&env.choices[0]&&env.choices[0].message&&typeof env.choices[0].message.content==='string')?env.choices[0].message.content:null;
      var obj=content?parseSectionJSON(content):null;
      if(!obj)toast('AI reply unreadable — hit Generate again');
      else fillSheet(p,section,obj,mode);
    });
  })
  .catch(function(){toast(timedOut?'The AI took too long — try again':'AI is busy — try again in a minute');})
  .finally(function(){busy=false;clearThinking();setGenButtons();updateFooter();});
}
var WHOLE_WANT={
  summary:function(o){return typeof o.summary==='string';},
  devices:function(o){return Array.isArray(o.devices);},
  vocab:function(o){return Array.isArray(o.words);},
  connections:function(o){return Array.isArray(o.connections);}
};
function generateWhole(p){
  if(busy)return;
  var sh=sheets[String(p)];
  if(!sh)return;
  var g=usageAllowed(L('usage',{}),Date.now(),MAKER);
  if(!g.ok){
    toast(g.reason==='limit'?'Daily AI limit reached ('+CFG.DAILY_LIMIT+'). Come back tomorrow.':'Wait '+g.retrySec+'s between AI calls — the button unlocks itself.');
    return;
  }
  g.u.calls++;g.u.lastCallTs=Date.now();g.u.day=todayStr();
  S('usage',g.u);
  busy=true;updateFooter();
  var wholeBtn=null;
  genButtons().forEach(function(b){if(b.getAttribute('data-gen')==='whole'){b.textContent='…';wholeBtn=b;}});
  setThinking(wholeBtn);
  var bk=L('book',{});
  var grounds={};
  SECKEYS.forEach(function(sec){
    var gd=sectionGrounding(bk,(sh.windows&&sh.windows[sec])||defaultPagesForSheet(1,bk.startPage||1));
    var gg={mode:gd.mode};
    if(gd.mode==='text'){gg.slice=gd.slice;}
    if(gd.mode==='plot'){gg.plot=bk.ground.plot;gg.characters=bk.ground.chars;}
    grounds[sec]=gg;
  });
  var sys=buildWholeSheetPrompt(bk,sh.windows||{},grounds);
  var timedOut=false;
  guardedFetch(CFG.BASE_URL+'/chat/completions',{
    method:'POST',
    headers:{'Authorization':'Bearer '+API_KEY,'content-type':'application/json'},
    body:JSON.stringify({model:CFG.MODEL,messages:[{role:'system',content:sys},{role:'user',content:'Fill the whole F.A.R.T. sheet. JSON only.'}],max_tokens:CFG.MAXT.whole,temperature:0.7})
  },CFG.MAX_WAIT_MS.whole,function(){timedOut=true;})
  .then(function(res){
    if(!res.ok){
      toast(res.status===401?'access key was rotated; ask the owner':'AI is busy — try again in a minute');
      return;
    }
    return res.text().then(function(txt){
      var env=parseSectionJSON(txt);
      var content=(env&&Array.isArray(env.choices)&&env.choices[0]&&env.choices[0].message&&typeof env.choices[0].message.content==='string')?env.choices[0].message.content:null;
      var obj=content?parseSectionJSON(content):null;
      var filled=0;
      if(obj&&typeof obj==='object'&&!Array.isArray(obj)){
        SECKEYS.forEach(function(sec){
          var sub=obj[sec];
          if(sub&&typeof sub==='object'&&WHOLE_WANT[sec](sub)){
            fillSheet(p,sec,sub,grounds[sec].mode);
            filled++;
          }
        });
      }
      if(filled===0)toast('Whole-sheet reply unreadable — use the section buttons below');
      else toast('Whole sheet drafted — fix quotes + page numbers!');
    });
  })
  .catch(function(){toast(timedOut?'The AI took too long — try again':'AI is busy — try again in a minute');})
  .finally(function(){busy=false;clearThinking();setGenButtons();updateFooter();});
}
function setOnlineBanner(on){
  var el=document.getElementById('offline');
  if(on)el.classList.add('hidden');else el.classList.remove('hidden');
  setGenButtons();
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('online',function(){setOnlineBanner(true);});
  window.addEventListener('offline',function(){setOnlineBanner(false);});
}
function isV2Shape(o){
  if(!o||typeof o!=='object'||Array.isArray(o))return false;
  var ks=Object.keys(o);
  for(var i=0;i<ks.length;i++){var e=o[ks[i]];if(e&&typeof e==='object'&&(e.section||e.pages))return true;}
  return false;
}
function initMigrate(){
  var p=L('parts',null);
  if(!L('sheets',null)&&p){
    var ar=L('archive',[]);
    if(!Array.isArray(ar))ar=[];
    ar.unshift({book:L('book',null),legacy:{parts:p},savedAt:Date.now()});
    S('archive',ar.slice(0,5));
    S('parts',null);
  }
  var v2=L('sheets',null);
  if(isV2Shape(v2)){
    var ar2=L('archive',[]);
    if(!Array.isArray(ar2))ar2=[];
    ar2.unshift({book:L('book',null),legacyV2:v2,savedAt:Date.now()});
    S('archive',ar2.slice(0,5));
    S('sheets',null);
  }
}
setInterval(updateFooter,1000);
updateFooter();
setOnlineBanner(!isOffline());
initMigrate();
route();
</script>
</body>
</html>
